# Collect 2 / Table 3 base config: calibrated color-source whole frames.
# MP4 decoding and frame extraction are external preparation steps.
# Expected input: <subject>/250m-c/*.jpg, <subject>/500m/*.jpg,
# <subject>/1000m/*.jpg. Keep the ground monochrome 250m pool separate.
# Uses the current winning full-frame calibration and native square DAAT outputs.
# Supply a cleaned frame pool: error/test-pattern frames are excluded upstream.
# The prepared local pool preserves the calibration's source and target samples.
# Relative paths resolve against this INI file's directory.
[paths]
stable_frames_dir = ../data/brc2_color_frames
p2s_data_dir = ../data/p2s_simulator_data
output_data_path = ../data/brc2_color_calibrated_synth
output_dir = ../table3_runs/frames_brc2_color_calibrated

[experiment]
camera_profile = brc2
source_camera = 250m-c
target_cameras = 500m, 1000m
# Generation budget per subject, pooled across all extracted source clips.
num_images = 20
num_subjects =
subjects =
sample_seed = 42
analysis_seed = 0
noise_seed = 1234
device = auto

[analysis]
num_images = 20
include_brisque = true
resize_512 = false
grayscale = true
trim_border = 1
workers = 8

[pybsm]
bridge = true
deconvolve = true
resample = false
distortion = false

[daatsim]
size = 512
alpha_tilt = 0.2
alpha_blur = 0.2
reset_between_subjects = true
reset_between_clips = true

[p2s]
size = auto

[target:500m]
pybsm_cn2 = 1e-14
daatsim_r0 = 0.035
p2s_r0 = 0.20

[target:1000m]
pybsm_cn2 = 1e-13
daatsim_r0 = 0.02
p2s_r0 = 0.10
