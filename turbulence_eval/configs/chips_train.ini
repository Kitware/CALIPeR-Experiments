# Training augmentation using the current ground-field corpus and shared-source filtering.
# Three paper turbulence severities; source/target pairing follows the existing 400m -> 1000m scripts.
[paths]
chip_root = /absolute/path/to/caliper-data/reid-chips
chip_index = /absolute/path/to/caliper-data/reid-chips/chip_index.jsonl
partition_file = /absolute/path/to/caliper-data/train_test_ids.json
corpus_dir = /absolute/path/to/caliper-data/splits/combined_brc1_brc2_train_corpus
output_data_path = ../data/synthetic_train_400_to_1000

[input]
partition = train
collections = brc1
deduplicate = true
max_images = -1
num_subjects =
subjects =

[experiment]
source_camera = 400m
sample_seed = 42
noise_seed = 1234
device = auto

[calibration]
brc1 = brc1

[variant:pybsm_weak]
simulator = pybsm
target_camera = 1000m
cn2 = 1e-13

[variant:pybsm_medium]
simulator = pybsm
target_camera = 1000m
cn2 = 4e-13

[variant:pybsm_strong]
simulator = pybsm
target_camera = 1000m
cn2 = 1e-12
