# Collect 1 / Table 3 base config: pre-extracted whole frames.
# MP4 decoding and frame extraction are external preparation steps.
# Expected input: <subject>/260m/*.jpg, <subject>/500m/*.jpg, <subject>/1000m/*.jpg.
# Relative paths resolve against this INI file's directory.
[paths]
stable_frames_dir = ../data/brc1_frames
p2s_data_dir = ../data/p2s_simulator_data
output_data_path = ../data/frames_table3_brc1
output_dir = ../table3_runs/frames_table3_brc1

[experiment]
camera_profile = brc1
source_camera = 260m
target_cameras = 500m, 1000m
# Generation budget per subject, pooled across all extracted source clips.
num_images = 20
num_subjects =
subjects =
sample_seed = 42
analysis_seed = 0
noise_seed = 1234
device = auto

[analysis]
num_images = 20
include_brisque = true
resize_512 = false
grayscale = false

[pybsm]
bridge = true
deconvolve = true
resample = false
distortion = false

[daatsim]
size = 512
alpha_tilt = 0.2
alpha_blur = 0.2
reset_between_subjects = false

[p2s]
size = auto

[target:500m]
pybsm_cn2 = 1e-12
daatsim_r0 = 0.035
p2s_r0 = 0.10

[target:1000m]
pybsm_cn2 = 1e-13
daatsim_r0 = 0.035
p2s_r0 = 0.10
