# Configuration for the simulation-fidelity comparison in CALIPeR Table 3.
# Results depend on the selected cohort, camera calibration and preprocessing.
# Relative paths are resolved against this INI file's directory.
[paths]
stable_frames_dir = ../data/stable_frames
p2s_data_dir = ../data/p2s_simulator_data
# Large synthetic images, input links and simulator caches; may be on another drive.
output_data_path = ../data/synthetic_table3
# Smaller analysis tables, CSVs, plots and report metadata.
output_dir = ../table3_runs/table3

[experiment]
# Source-camera calibration label; the paper describes the source range as 250m.
source_camera = 260m
target_cameras = 500m, 1000m
# Source frames generated per subject, shared by all simulators and target ranges.
num_images = 20
# Empty means all eligible subjects. Set a count or explicit IDs for a small run.
num_subjects =
subjects =
sample_seed = 42
analysis_seed = 0
noise_seed = 1234
device = auto

[analysis]
# Independently sampled images per subject in each real/synthetic group.
num_images = 5
include_brisque = true
# False keeps simulator output sizes. True evaluates all images at 512x512.
resize_512 = false
grayscale = false

[pybsm]
bridge = true
deconvolve = true
resample = false
distortion = false

[daatsim]
size = 512
alpha_tilt = 0.2
alpha_blur = 0.2
# False carries temporal state across subjects; true resets it at each subject.
reset_between_subjects = false

[p2s]
# Nearest supported size to the source image's shorter dimension.
size = auto

[target:500m]
pybsm_cn2 = 1e-12
daatsim_r0 = 0.035
p2s_r0 = 0.10

[target:1000m]
pybsm_cn2 = 1e-13
daatsim_r0 = 0.035
p2s_r0 = 0.10
