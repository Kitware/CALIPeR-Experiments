# Flat-image generation. Set mode=subject-tree for <subject>/<native-camera>/*.jpg.
[paths]
input_dir = ../data/images
output_data_path = ../data/synthetic_images

[input]
mode = images
max_images = -1

[experiment]
source_camera = 250m
noise_seed = 1234

[variant:pybsm_500m]
simulator = pybsm
target_camera = 500m
cn2 = 1e-12
