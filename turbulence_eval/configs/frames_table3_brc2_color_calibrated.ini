# Compatibility name for frames_table3_brc2.ini; keep settings aligned.
# BRC2 whole-frame Table 3: color source, grayscale analysis, native DAAT.
# Paths resolve relative to this config directory. No split_generation imports.
# data/brc2_color_frames is the frozen cleaned input pool: 20 selected sources
# per subject, 55 invalid 500m targets and 40 invalid 1000m targets excluded.
# data/brc2_color_calibrated_synth may contain the existing winning simulations.
# Edit these data locations after cloning; datasets and model assets are ignored.
[paths]
stable_frames_dir = ../data/brc2_color_frames
p2s_data_dir = ../data/p2s_simulator_data
output_data_path = ../data/brc2_color_calibrated_synth
output_dir = ../table3_runs/frames_brc2_color_calibrated

[experiment]
camera_profile = brc2
source_camera = 250m-c
target_cameras = 500m, 1000m
num_images = 20
num_subjects =
subjects =
sample_seed = 42
analysis_seed = 0
noise_seed = 1234
device = auto

[analysis]
num_images = 20
include_brisque = true
resize_512 = false
grayscale = true
trim_border = 1
workers = 8

[pybsm]
bridge = true
deconvolve = true
resample = false
distortion = false

[daatsim]
# Saved outputs and metric inputs stay at this native square resolution.
# Source-aspect restoration is a visualization-only operation.
size = 512
alpha_tilt = 0.2
alpha_blur = 0.2
reset_between_subjects = true
# Match the calibration sweep's temporal boundaries between source clips.
reset_between_clips = true

[p2s]
size = auto

[target:500m]
pybsm_cn2 = 1e-14
daatsim_r0 = 0.035
p2s_r0 = 0.20

[target:1000m]
pybsm_cn2 = 1e-13
daatsim_r0 = 0.02
p2s_r0 = 0.10
