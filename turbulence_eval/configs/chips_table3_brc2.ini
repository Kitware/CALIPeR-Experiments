# Collect 2 / Table 3 base config: indexed ground-camera person chips.
# Run generate_synthetic_data, then create_table3 with this same INI.
# The indexed 250m pool uses the ground monochrome station, not 250m-c.
# Uses BRC2 nominal optics; turbulence strengths below remain BRC1 proxies.
# The full-frame 250m-c calibration has not been validated for these chips.
[paths]
chip_root = /absolute/path/to/caliper-data/reid-chips
chip_index = /absolute/path/to/caliper-data/reid-chips/chip_index.jsonl
partition_file = /absolute/path/to/caliper-data/train_test_ids.json
p2s_data_dir = ../data/p2s_simulator_data
output_data_path = ../data/chips_table3_brc2
output_dir = ../table3_runs/chips_brc2

[input]
mode = chips
purpose = quality
# All BRC2 subjects; these outputs are for quality comparison, not Re-ID training.
partition = all
collections = brc2
max_images = 20
num_subjects =
subjects =

[experiment]
source_camera = 250m
sample_seed = 42
noise_seed = 1234
device = auto

[calibration]
brc2 = brc2

[analysis]
# Preserve the chip comparison's five-image measurement budget.
num_images = 5
seed = 0
include_brisque = true
resize_512 = false
grayscale = false

[pybsm]
bridge = true
deconvolve = true
resample = false
distortion = false

[daatsim]
size = 512
alpha_tilt = 0.2
alpha_blur = 0.2

[p2s]
size = auto

[variant:pybsm_500m]
simulator = pybsm
target_camera = 500m
cn2 = 1e-12

[variant:daatsim_500m]
simulator = daatsim
target_camera = 500m
r0 = 0.035

[variant:p2s_500m]
simulator = p2s
target_camera = 500m
r0 = 0.10

[variant:pybsm_1000m]
simulator = pybsm
target_camera = 1000m
cn2 = 1e-13

[variant:daatsim_1000m]
simulator = daatsim
target_camera = 1000m
r0 = 0.035

[variant:p2s_1000m]
simulator = p2s
target_camera = 1000m
r0 = 0.10
