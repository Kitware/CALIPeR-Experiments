# Figure 6 generation: real 500m query chips -> simulated 1000m, fixed real gallery.
# Paths resolve relative to this INI. Edit dataset mounts and the evaluation split.
[paths]
chip_root = /absolute/path/to/caliper-data/reid-chips
chip_index = /absolute/path/to/caliper-data/reid-chips/chip_index.jsonl
partition_file = /absolute/path/to/caliper-data/train_test_ids.json
# Use a split with a 400m gallery and 500m queries for the paper protocol.
split_json = /absolute/path/to/caliper-data/splits/combined_brc1_brc2_test/test_ground-range_combined_paperGR.json
output_data_path = ../data/synthetic_test_500_to_1000

[input]
# chips is the default mode; train/test partition must always be explicit.
mode = chips
partition = test
collections = brc1
protocol_version = v4
source_role = query
max_images = -1
num_subjects =
subjects =

[experiment]
source_camera = 500m
sample_seed = 42
noise_seed = 1234
device = auto

[calibration]
brc1 = brc1
# For a mixed-collection run also select collections = brc1 brc2 above and:
# brc2 = brc2

[pybsm]
bridge = true
deconvolve = true
resample = false
distortion = false

[variant:pybsm_weak]
simulator = pybsm
target_camera = 1000m
cn2 = 1e-13

[variant:pybsm_medium]
simulator = pybsm
target_camera = 1000m
cn2 = 4e-13

[variant:pybsm_strong]
simulator = pybsm
target_camera = 1000m
cn2 = 1e-12
