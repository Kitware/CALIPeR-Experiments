# Companion to the existing 250m -> 500m training-chip scripts.
# For evaluation, use partition=test and replace corpus_dir with split_json.
[paths]
chip_root = /absolute/path/to/caliper-data/reid-chips
chip_index = /absolute/path/to/caliper-data/reid-chips/chip_index.jsonl
partition_file = /absolute/path/to/caliper-data/train_test_ids.json
corpus_dir = /absolute/path/to/caliper-data/splits/combined_brc1_brc2_train_corpus
output_data_path = ../data/synthetic_train_250_to_500

[input]
partition = train
collections = brc1
deduplicate = true
max_images = -1

[experiment]
source_camera = 250m
sample_seed = 42
noise_seed = 1234
device = auto

[calibration]
brc1 = brc1

[variant:pybsm_weak]
simulator = pybsm
target_camera = 500m
cn2 = 1e-13

[variant:pybsm_medium]
simulator = pybsm
target_camera = 500m
cn2 = 4e-13

[variant:pybsm_strong]
simulator = pybsm
target_camera = 500m
cn2 = 1e-12
