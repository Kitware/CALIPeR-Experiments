# Collect 1 / Figure 6 generation: indexed test chips, 500m -> 1000m.
# Extract features from the generated eval/ directory; see ../README.md#figure-6.
# Figure 6 uses three paper Cn2 severities, independently of Table 3 calibration.
[paths]
chip_root = /absolute/path/to/caliper-data/reid-chips
chip_index = /absolute/path/to/caliper-data/reid-chips/chip_index.jsonl
partition_file = /absolute/path/to/caliper-data/train_test_ids.json
# Must supply a 400m gallery and 500m/1000m queries; filtered to Collect 1 below.
split_json = /absolute/path/to/caliper-data/splits/combined_brc1_brc2_test/test_ground-range_combined_paperGR.json
output_data_path = ../data/chips_fig6_brc1

[input]
mode = chips
purpose = reid
partition = test
collections = brc1
protocol_version = v4
source_role = query
# Preserve all source frames and their tracklet grouping for evaluation.
max_images = -1
num_subjects =
subjects =

[experiment]
source_camera = 500m
sample_seed = 42
noise_seed = 1234
device = auto

[calibration]
brc1 = brc1

[pybsm]
bridge = true
deconvolve = true
resample = false
distortion = false

[variant:pybsm_weak]
simulator = pybsm
target_camera = 1000m
cn2 = 1e-13

[variant:pybsm_medium]
simulator = pybsm
target_camera = 1000m
cn2 = 4e-13

[variant:pybsm_strong]
simulator = pybsm
target_camera = 1000m
cn2 = 1e-12
