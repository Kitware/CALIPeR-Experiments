# Fine-tune BoT on CALIPeR ground-camera crops. Pass the starting Re-ID weights
# to tools/train_caliper.py with --init-weight. The classifier is fitted to the
# 230 training identities. Each batch contains 16 identities and 4 crops per identity.

MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: ''                 # set by --init-weight in tools/train_caliper.py
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'resnet50'
  LAST_STRIDE: 1
  NECK: 'bnneck'

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.485, 0.456, 0.406]   # ImageNet -- matches the zero-shot extractor exactly
  PIXEL_STD: [0.229, 0.224, 0.225]

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 3                    # raise if you have more CPU cores

SOLVER:
  OPTIMIZER_NAME: 'Adam'
  MAX_EPOCHS: 120
  BASE_LR: 0.00035
  BIAS_LR_FACTOR: 2
  WEIGHT_DECAY: 0.0005
  WEIGHT_DECAY_BIAS: 0.0
  IMS_PER_BATCH: 64
  STEPS: [40, 70]
  GAMMA: 0.1
  WARMUP_FACTOR: 0.01
  WARMUP_ITERS: 10
  WARMUP_METHOD: 'linear'
  CHECKPOINT_PERIOD: 20
  LOG_PERIOD: 50
  EVAL_PERIOD: 20                   # only valid with --holdout; with no holdout the val split is empty,
                                    # so pass SOLVER.EVAL_PERIOD 999 (as the published runs did)

TEST:
  IMS_PER_BATCH: 128
  RE_RANKING: 'no'
  WEIGHT: ''
  NECK_FEAT: 'after'                # matches the zero-shot extractor
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/caliper_ground_bot'
