[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "caliper-reid-eval"
version = "0.1.0"
description = "Person re-identification evaluation for the CALIPeR benchmark."
requires-python = ">=3.7"
dependencies = ["numpy"]

[project.optional-dependencies]
train = ["torch"]

[project.scripts]
caliper-eval = "caliper_eval.eval_from_features:main"

[tool.setuptools]
license-files = ["LICENSE", "methods/README.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["caliper_eval*"]

